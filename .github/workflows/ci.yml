name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` rather than `install`: fails loudly if the lockfile and
      # package.json have drifted, which is exactly what CI should catch.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

      - name: Test
        run: npx jest --ci

  bundle:
    name: Metro bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only worth the minutes once the cheap checks have passed.
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Proves every import resolves and all JSX compiles — the class of
      # breakage that typecheck alone does not catch.
      - name: Export bundle
        run: npx expo export --platform ios --output-dir /tmp/expo-export
